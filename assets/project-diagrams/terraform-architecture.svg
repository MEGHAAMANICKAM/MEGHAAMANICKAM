<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" role="img" aria-labelledby="title desc">
  <title id="title">Terraform EC2 bootstrap architecture</title>
  <desc id="desc">Terraform provisions AWS IAM, a security group, and an EC2 instance that runs Linux Bash user data.</desc>
  <rect width="1200" height="170" rx="14" fill="#F7F5F0" stroke="#DED9CE"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <g fill="#5E6B61" font-size="12" font-weight="700"><text x="150" y="42">CODE</text><text x="430" y="42">SECURITY</text><text x="700" y="42">COMPUTE</text><text x="1000" y="42">BOOTSTRAP</text></g>
    <g fill="#343936" font-size="15"><text x="150" y="92">Terraform</text><text x="430" y="92">IAM + SG</text><text x="700" y="92">EC2</text><text x="1000" y="92">Linux + Bash</text></g>
    <g fill="#777770" font-size="11"><text x="150" y="119">reusable config</text><text x="430" y="119">least privilege</text><text x="700" y="119">environment</text><text x="1000" y="119">user data</text></g>
  </g>
  <g stroke="#9A7B62" stroke-width="2" fill="none"><path d="M250 86h130m170 0h120m130 0h170"/><path d="m371 79 9 7-9 7m111-14 9 7-9 7m111-14 9 7-9 7m171-14 9 7-9 7"/></g>
</svg>
